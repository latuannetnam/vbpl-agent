services:
  vbpl-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: vbpl-kb-pipeline:latest
    restart: "no"
    command: ["run-daily", "--db-path", "/app/data/state.sqlite3"]
    volumes:
      - vbpl-pipeline-data:/app/data
    environment:
      - VBPL_KB_DATA_DIR=/app/data
      - VBPL_KB_EXPORT_DIR=${VBPL_KB_EXPORT_DIR:-/app/data/exports}
      - VBPL_KB_VBPL_GATEWAY_URL=https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public
      - VBPL_KB_ONYX_BASE_URL=${VBPL_KB_ONYX_BASE_URL:-http://api_server:8080}
      - VBPL_KB_ONYX_API_KEY=${VBPL_KB_ONYX_API_KEY:-}
      - VBPL_KB_ONYX_CONNECTOR_ID=${VBPL_KB_ONYX_CONNECTOR_ID:-}
      - VBPL_KB_ONYX_SEARCH_PATH=${VBPL_KB_ONYX_SEARCH_PATH:-/admin/search}
      - VBPL_KB_ONYX_HEALTH_PATH=${VBPL_KB_ONYX_HEALTH_PATH:-/health}
      - VBPL_KB_ONYX_REQUEST_TIMEOUT_SECONDS=${VBPL_KB_ONYX_REQUEST_TIMEOUT_SECONDS:-120}
    networks:
      - onyx

volumes:
  vbpl-pipeline-data:

networks:
  onyx:
    external: true
    name: vbpl-onyx_default
