services:
  api_server:
    image: vbpl-onyx-backend:latest
    build:
      context: ../../backend
      dockerfile: ../../../infra/onyx/Dockerfile.vbpl

  background:
    image: vbpl-onyx-backend:latest
    build:
      context: ../../backend
      dockerfile: ../../../infra/onyx/Dockerfile.vbpl
    volumes:
      - $VBPL_EXPORT_HOST_PATH:/app/vbpl-export:ro

  indexing_model_server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

