[project]
name = "vbpl-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
vbpl-kb = "vbpl_kb.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "postgres: marks tests requiring live PostgreSQL instance",
]

[tool.uv]
package = true

