        <div class="article" id="dieu-12">
          <h4>Điều 12. Hồ sơ khai thuế</h4>
          <div class="clause" id="khoan-01">
            <p>1. Hồ sơ khai thuế bao gồm các tài liệu sau đây:</p>
            <div class="point" id="diem-a">
              <p>a) Tờ khai thuế theo mẫu quy định;</p>
            </div>
            <div class="point" id="diem-b">
              <p>b) Phụ lục bảng kê chứng từ kèm theo.</p>
            </div>
          </div>
